<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Will it Break?</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #61717f;
      --line: #d7dfe5;
      --panel: #f7f9fb;
      --grid: #dbe3e8;
      --deck: #9a7b57;
      --wood: #8a5a36;
      --blue: #285c87;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: #eef2f4;
      font-family: Inter, "Segoe UI", sans-serif;
    }

    button,
    select,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--white);
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .mode-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .mode-switch button {
      min-width: 78px;
      border: 0;
      border-radius: 5px;
      padding: 7px 12px;
      color: var(--muted);
      background: transparent;
    }

    .mode-switch .active {
      color: var(--white);
      background: var(--blue);
    }

    .workspace {
      display: grid;
      grid-template-columns: 150px minmax(420px, 1fr) 210px;
      gap: 12px;
      min-height: 0;
      padding: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
    }

    .tool-panel,
    .status-panel {
      padding: 12px;
    }

    .panel-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tool-list {
      display: grid;
      gap: 8px;
    }

    .tool {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--white);
      text-align: left;
    }

    .tool.active {
      border-color: var(--blue);
      box-shadow: inset 3px 0 var(--blue);
      background: #edf4fa;
    }

    .canvas-panel {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      overflow: hidden;
    }

    .hint {
      min-height: 42px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel);
      font-size: 0.9rem;
    }

    .canvas {
      min-height: 420px;
      background: var(--white);
      overflow: hidden;
    }

    .canvas svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .test-controls {
      display: flex;
      align-items: end;
      gap: 10px;
      min-height: 78px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .control {
      display: grid;
      gap: 5px;
      min-width: 150px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .control select,
    .control input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      background: var(--white);
    }

    .test-actions {
      display: flex;
      gap: 7px;
      margin-left: auto;
    }

    .test-actions button,
    .details-toggle {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      background: var(--white);
    }

    .test-actions .primary {
      border-color: var(--blue);
      color: var(--white);
      background: var(--blue);
    }

    .status-panel {
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .stat {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .stat-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .safe {
      color: #247a46;
    }

    .details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      margin: 0 12px 12px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }

    .details-toggle {
      color: var(--blue);
    }

    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: 130px minmax(380px, 1fr);
      }

      .status-panel {
        grid-column: 1 / -1;
        grid-template-columns: repeat(4, 1fr);
      }

      .stat {
        border-bottom: 0;
      }
    }

    @media (max-width: 700px) {
      .topbar {
        align-items: flex-start;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .tool-panel {
        order: 2;
      }

      .tool-list {
        grid-template-columns: repeat(2, 1fr);
      }

      .canvas-panel {
        order: 1;
      }

      .status-panel {
        order: 3;
        grid-column: auto;
        grid-template-columns: repeat(2, 1fr);
      }

      .canvas {
        min-height: 340px;
      }

      .test-controls {
        align-items: stretch;
        flex-wrap: wrap;
      }

      .control {
        min-width: calc(50% - 5px);
      }

      .test-actions {
        width: 100%;
        margin-left: 0;
      }

      .test-actions button {
        flex: 1;
      }
    }

    :focus-visible {
      outline: 3px solid #f2b84b;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Will it Break?</h1>
      <nav class="mode-switch" aria-label="App mode">
        <button class="active" type="button" aria-pressed="true">Build</button>
        <button type="button" aria-pressed="false">Test</button>
      </nav>
    </header>

    <section class="workspace" aria-label="Bridge design workspace">
      <aside class="panel tool-panel" aria-labelledby="tools-heading">
        <h2 class="panel-title" id="tools-heading">Build tools</h2>
        <div class="tool-list">
          <button class="tool active" id="addMemberTool" type="button">Add Member</button>
          <button class="tool" id="eraseMemberTool" type="button" aria-label="Erase member">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="vertical-align:-4px;margin-right:5px">
              <path d="M3 11.5 10.5 4l3.5 3.5-7.5 7.5H5.5Z" fill="#f49ac2" stroke="#c43b84" stroke-width="1.5"/>
              <path d="m6.5 15 7.5-7.5" stroke="#c43b84" stroke-width="1.5"/>
            </svg>
            Erase Member
          </button>
          <button class="tool" id="dragJointTool" type="button">Drag Joint</button>
          <button class="tool" id="clearBridgeTool" type="button" aria-label="Clear bridge">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="vertical-align:-4px;margin-right:5px">
              <path d="M5 6h8l-.7 9H5.7Z" fill="#111" stroke="#111" stroke-width="1"/>
              <path d="M3.5 4h11M7 2.5h4M7 4v11M11 4v11" fill="none" stroke="#111" stroke-width="1.5"/>
            </svg>
            Clear Bridge
          </button>
        </div>
      </aside>

      <section class="panel canvas-panel" aria-label="60 foot bridge grid">
        <div class="hint" role="status">Add Member: click the first endpoint, then the second endpoint.</div>

        <div class="canvas">
          <svg viewBox="0 0 1200 500" role="img" aria-label="Mockup of the 60 foot by 25 foot bridge grid">
            <defs>
              <pattern id="smallGrid" x="100" y="110" width="16.6667" height="7.2" patternUnits="userSpaceOnUse">
                <path d="M 16.6667 0 L 0 0 0 7.2" fill="none" stroke="#dbe3e8" stroke-width="1"/>
              </pattern>
              <pattern id="road" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="24" height="24" fill="#dfe6e9"/>
                <rect width="12" height="24" fill="#d5dde1"/>
              </pattern>
            </defs>

            <rect width="1200" height="500" fill="#fff"/>
            <rect x="100" y="110" width="1000" height="180" fill="url(#smallGrid)" stroke="#dbe3e8"/>

            <rect x="0" y="312" width="250" height="96" rx="4" fill="url(#road)" stroke="#bdc8ce"/>
            <rect x="950" y="312" width="250" height="96" rx="4" fill="url(#road)" stroke="#bdc8ce"/>

            <g aria-label="Bridge abutments">
              <polygon points="100,290 250,408 100,408" fill="#c9b99f" stroke="#17212b" stroke-width="3"/>
              <polygon points="1100,290 950,408 1100,408" fill="#c9b99f" stroke="#17212b" stroke-width="3"/>
            </g>

            <rect x="100" y="290" width="1000" height="12" rx="4" fill="#9a7b57"/>
            <rect x="100" y="302" width="1000" height="6" fill="#bd9d76"/>

            <g id="memberLines" stroke="#8a5a36" stroke-width="10" stroke-linecap="round" data-members>
              <line x1="100" y1="290" x2="350" y2="180"/>
              <line x1="350" y1="180" x2="600" y2="120"/>
              <line x1="600" y1="120" x2="850" y2="180"/>
              <line x1="850" y1="180" x2="1100" y2="290"/>
              <line x1="266" y1="290" x2="350" y2="180"/>
              <line x1="433" y1="290" x2="350" y2="180"/>
              <line x1="433" y1="290" x2="600" y2="120"/>
              <line x1="767" y1="290" x2="600" y2="120"/>
              <line x1="767" y1="290" x2="850" y2="180"/>
              <line x1="934" y1="290" x2="850" y2="180"/>
            </g>
            <line id="memberOutline" x1="0" y1="0" x2="0" y2="0"
                  stroke="#285c87" stroke-width="4" stroke-dasharray="10 7"
                  stroke-linecap="round" opacity="0" pointer-events="none"/>

            <g fill="none" stroke="#17212b" stroke-width="5">
              <path d="M100 290 L72 318 L128 318 Z"/>
              <path d="M1100 290 L1072 318 L1128 318 Z"/>
            </g>

            <g id="jointCircles" fill="#fff" stroke="#17212b" stroke-width="3" aria-label="Bridge joints">
              <circle data-fixed="pin" cx="100" cy="290" r="9"/>
              <circle data-deck="true" cx="266" cy="290" r="7"/>
              <circle data-deck="true" cx="433" cy="290" r="7"/>
              <circle data-deck="true" cx="600" cy="290" r="7"/>
              <circle data-deck="true" cx="767" cy="290" r="7"/>
              <circle data-deck="true" cx="934" cy="290" r="7"/>
              <circle data-fixed="roller" cx="1100" cy="290" r="9"/>
              <circle cx="350" cy="180" r="8"/>
              <circle cx="600" cy="120" r="8"/>
              <circle cx="850" cy="180" r="8"/>
            </g>

            <g fill="#61717f" font-size="14" text-anchor="middle">
              <text x="100" y="350">0 ft</text>
              <text x="266" y="350">10 ft</text>
              <text x="433" y="350">20 ft</text>
              <text x="600" y="350">30 ft</text>
              <text x="767" y="350">40 ft</text>
              <text x="934" y="350">50 ft</text>
              <text x="1100" y="350">60 ft</text>
            </g>

            <g id="previewVehicle" aria-label="Side view car">
              <path d="M684 276 L706 276 L725 252 L773 252 L794 276 L808 276 L818 288 L818 292 L678 292 L678 284 Z"
                    fill="#d9b72c" stroke="#17212b" stroke-width="3" stroke-linejoin="round"/>
              <path d="M724 256 L709 276 L746 276 L746 256 Z" fill="#a9cad4" stroke="#17212b" stroke-width="2"/>
              <path d="M750 256 L750 276 L789 276 L770 256 Z" fill="#a9cad4" stroke="#17212b" stroke-width="2"/>
              <rect x="680" y="282" width="136" height="12" rx="5" fill="#d9b72c" stroke="#17212b" stroke-width="3"/>
              <circle cx="716" cy="292" r="13" fill="#17212b"/>
              <circle cx="716" cy="292" r="6" fill="#eef2f4"/>
              <circle cx="780" cy="292" r="13" fill="#17212b"/>
              <circle cx="780" cy="292" r="6" fill="#eef2f4"/>
              <rect x="808" y="282" width="10" height="7" rx="3" fill="#e66f4a" stroke="#17212b" stroke-width="1"/>
              <rect x="680" y="282" width="7" height="7" rx="2" fill="#fff4b0" stroke="#17212b" stroke-width="1"/>
            </g>
          </svg>
        </div>

        <div class="test-controls" aria-label="Test mode controls">
          <label class="control">
            Vehicle
            <select>
              <option>Semi</option>
              <option>Car</option>
              <option>Loaded Dump Truck</option>
              <option>Fire Engine</option>
            </select>
          </label>
          <label class="control">
            Front axle position
            <input type="number" value="44" aria-label="Front axle position in feet">
          </label>
          <div class="test-actions">
            <button type="button">Park</button>
            <button class="primary" type="button">Drive Across</button>
            <button type="button">Pause</button>
          </div>
        </div>
      </section>

      <aside class="panel status-panel" aria-label="Bridge status">
        <h2 class="panel-title">Bridge status</h2>
        <div class="stat">
          <span class="stat-label">Cost</span>
          <span class="stat-value">$12,500</span>
        </div>
        <div class="stat">
          <span class="stat-label">Structural joints</span>
          <span class="stat-value">3</span>
        </div>
        <div class="stat">
          <span class="stat-label">Members</span>
          <span class="stat-value">10</span>
        </div>
        <div class="stat">
          <span class="stat-label">Stability</span>
          <span class="stat-value safe">Stable</span>
        </div>
      </aside>
    </section>

    <section class="details" aria-label="Details panel">
      <span>Details panel</span>
      <button class="details-toggle" type="button" aria-expanded="false">Open details</button>
    </section>
  </main>
  <script>
    const svg = document.querySelector(".canvas svg");
    const jointCircles = document.querySelector("#jointCircles");
    const memberLines = document.querySelector("#memberLines");
    const memberOutline = document.querySelector("#memberOutline");
    const hint = document.querySelector(".hint");
    const toolButtons = [...document.querySelectorAll(".tool")];
    let activeTool = "add-member";
    let firstMemberPoint = null;
    const originX = 100;
    const originY = 290;
    const feetPerSvgX = 1000 / 60;
    const svgPerFootY = 7.2;

    function snapToFootGrid(clientX, clientY) {
      const bounds = svg.getBoundingClientRect();
      const svgX = (clientX - bounds.left) * 1200 / bounds.width;
      const svgY = (clientY - bounds.top) * 500 / bounds.height;
      const footX = Math.round((svgX - originX) / feetPerSvgX);
      const footY = Math.round((originY - svgY) / svgPerFootY);

      if (footX < 0 || footX > 60 || footY < 0 || footY > 25) {
        return null;
      }

      return {
        footX,
        footY,
        svgX: originX + footX * feetPerSvgX,
        svgY: originY - footY * svgPerFootY
      };
    }

    svg.addEventListener("mousemove", (event) => {
      if (activeTool !== "addMemberTool" || !firstMemberPoint) {
        memberOutline.setAttribute("opacity", "0");
        return;
      }

      const point = snapToFootGrid(event.clientX, event.clientY);
      if (!point) {
        memberOutline.setAttribute("opacity", "0");
        return;
      }

      memberOutline.setAttribute("x1", firstMemberPoint.svgX);
      memberOutline.setAttribute("y1", firstMemberPoint.svgY);
      memberOutline.setAttribute("x2", point.svgX);
      memberOutline.setAttribute("y2", point.svgY);
      memberOutline.setAttribute("opacity", "0.9");
    });

    function setActiveTool(tool) {
      activeTool = tool;
      firstMemberPoint = null;
      memberOutline.setAttribute("opacity", "0");
      toolButtons.forEach((button) => button.classList.remove("active"));
      document.querySelector(`#${tool}`).classList.add("active");
    }

    function findOrAddJoint(point) {
      const existing = [...jointCircles.querySelectorAll("circle")].find((circle) => {
        return Math.abs(Number(circle.getAttribute("cx")) - point.svgX) < 1
          && Math.abs(Number(circle.getAttribute("cy")) - point.svgY) < 1;
      });
      if (existing) {
        return existing;
      }

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", point.svgX);
      circle.setAttribute("cy", point.svgY);
      circle.setAttribute("r", "8");
      circle.setAttribute("fill", "#fff");
      circle.setAttribute("stroke", "#17212b");
      circle.setAttribute("stroke-width", "3");
      circle.dataset.memberJoint = "true";
      jointCircles.appendChild(circle);
      return circle;
    }

    function removeOrphanMemberJoints() {
      [...jointCircles.querySelectorAll("circle[data-member-joint='true']")].forEach((circle) => {
        const cx = Number(circle.getAttribute("cx"));
        const cy = Number(circle.getAttribute("cy"));
        const used = [...memberLines.querySelectorAll("line")].some((line) => {
          return (Math.abs(Number(line.getAttribute("x1")) - cx) < 1
            && Math.abs(Number(line.getAttribute("y1")) - cy) < 1)
            || (Math.abs(Number(line.getAttribute("x2")) - cx) < 1
            && Math.abs(Number(line.getAttribute("y2")) - cy) < 1);
        });
        if (!used) {
          circle.remove();
        }
      });
    }

    document.querySelector("#addMemberTool").addEventListener("click", () => {
      setActiveTool("addMemberTool");
      hint.textContent = "Add Member: click the first endpoint, then the second endpoint.";
    });
    document.querySelector("#eraseMemberTool").addEventListener("click", () => {
      setActiveTool("eraseMemberTool");
      hint.textContent = "Erase Member: click a member to delete it.";
    });
    document.querySelector("#dragJointTool").addEventListener("click", () => {
      setActiveTool("dragJointTool");
      hint.textContent = "Drag Joint: joint dragging is not active in the Stage 1 mockup.";
    });
    document.querySelector("#clearBridgeTool").addEventListener("click", () => {
      memberLines.replaceChildren();
      [...jointCircles.querySelectorAll("circle")].forEach((circle) => {
        if (!circle.hasAttribute("data-fixed") && !circle.hasAttribute("data-deck")) {
          circle.remove();
        }
      });
      firstMemberPoint = null;
      setActiveTool("addMemberTool");
      hint.textContent = "Bridge cleared. The deck joints and supports are unchanged.";
    });

    svg.addEventListener("click", (event) => {
      if (event.target.closest("#previewVehicle")) {
        return;
      }

      if (activeTool === "erase-member") {
        const line = event.target.closest("line");
        if (line && memberLines.contains(line)) {
          line.remove();
          removeOrphanMemberJoints();
          hint.textContent = "Member erased.";
        } else {
          hint.textContent = "Click a member to erase it.";
        }
        return;
      }

      if (activeTool === "eraseMemberTool") {
        const line = event.target.closest("line");
        if (line && memberLines.contains(line)) {
          line.remove();
          removeOrphanMemberJoints();
          hint.textContent = "Member erased.";
        } else {
          hint.textContent = "Click a member to erase it.";
        }
        return;
      }

      if (activeTool !== "addMemberTool") {
        return;
      }

      const point = snapToFootGrid(event.clientX, event.clientY);
      if (!point) {
        hint.textContent = "Joint placement is limited to the 60 ft by 25 ft grid.";
        return;
      }

      if (point.footY === 0 && point.footX !== 0 && point.footX !== 60 && point.footX % 10 !== 0) {
        hint.textContent = "Deck joints may only be placed at 10 ft intervals.";
        return;
      }

      if (!firstMemberPoint) {
        firstMemberPoint = point;
        hint.textContent = `First endpoint set at x = ${point.footX} ft, y = ${point.footY} ft. Choose the second endpoint.`;
        return;
      }

      if (Math.abs(firstMemberPoint.svgX - point.svgX) < 1
        && Math.abs(firstMemberPoint.svgY - point.svgY) < 1) {
        hint.textContent = "A member needs two distinct endpoints.";
        firstMemberPoint = point;
        return;
      }

      const duplicate = [...memberLines.querySelectorAll("line")].some((line) => {
        const a = [Number(line.getAttribute("x1")), Number(line.getAttribute("y1"))];
        const b = [Number(line.getAttribute("x2")), Number(line.getAttribute("y2"))];
        const p1 = [firstMemberPoint.svgX, firstMemberPoint.svgY];
        const p2 = [point.svgX, point.svgY];
        return (a[0] === p1[0] && a[1] === p1[1] && b[0] === p2[0] && b[1] === p2[1])
          || (b[0] === p1[0] && b[1] === p1[1] && a[0] === p2[0] && a[1] === p2[1]);
      });
      if (duplicate) {
        hint.textContent = "A member already exists between those joints.";
        firstMemberPoint = point;
        memberOutline.setAttribute("x1", point.svgX);
        memberOutline.setAttribute("y1", point.svgY);
        memberOutline.setAttribute("x2", point.svgX);
        memberOutline.setAttribute("y2", point.svgY);
        return;
      }

      findOrAddJoint(firstMemberPoint);
      findOrAddJoint(point);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", firstMemberPoint.svgX);
      line.setAttribute("y1", firstMemberPoint.svgY);
      line.setAttribute("x2", point.svgX);
      line.setAttribute("y2", point.svgY);
      line.setAttribute("stroke", "#8a5a36");
      line.setAttribute("stroke-width", "10");
      line.setAttribute("stroke-linecap", "round");
      memberLines.appendChild(line);
      hint.textContent = `Member added with joints at both endpoints: (${firstMemberPoint.footX}, ${firstMemberPoint.footY}) and (${point.footX}, ${point.footY}).`;
      firstMemberPoint = point;
    });
  </script>
</body>
</html>
